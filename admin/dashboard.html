<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Tajiri AI</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="visibility: hidden;">
    <div class="sidebar">
        <div class="sidebar-header"><h2>Tajiri AI</h2></div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-section="dashboard"><span class="icon">📊</span>Dashboard</a>
            <a href="#" class="nav-item" data-section="users"><span class="icon">👥</span>User Management</a>
            <a href="#" class="nav-item" data-section="content"><span class="icon">📝</span>Content Management</a>
            <a href="#" class="nav-item" data-section="support"><span class="icon">📫</span>Support Tickets</a>
        </nav>
        <div class="sidebar-footer">
            <button id="logout-btn" class="btn btn-danger">Sign Out</button>
        </div>
    </div>

    <main class="main-content">
        <section id="dashboard" class="content-section active">
            <div class="page-header"><h1>Analytics Dashboard</h1></div>
            <div class="stats-grid">
                <div class="card stat-card"><div class="icon">👥</div><div class="info"><div id="total-users" class="value">--</div><div class="label">Total Users</div></div></div>
                <div class="card stat-card"><div class="icon">📈</div><div class="info"><div id="dau" class="value">--</div><div class="label">Daily Active Users</div></div></div>
                <div class="card stat-card"><div class="icon">🚀</div><div class="info"><div id="retention" class="value">--%</div><div class="label">Retention Rate</div></div></div>
            </div>
            <div class="charts-grid">
                <div class="card"><div class="card-header"><h3 class="card-title">User Registration Trends</h3></div><canvas id="user-registrations-chart"></canvas></div>
                <div class="card"><div class="card-header"><h3 class="card-title">Feature Adoption</div><canvas id="feature-adoption-chart"></canvas></div>
            </div>
        </section>

        <section id="users" class="content-section">
            <div class="page-header"><h1>User Management</h1></div>
            <div class="card">
                <div class="table-container">
                    <table>
                        <thead><tr><th>User</th><th>Email</th><th>Reg. Date</th><th>Health Score</th><th>Actions</th></tr></thead>
                        <tbody id="user-table-body"></tbody>
                    </table>
                </div>
            </div>
        </section>
        
        </main>

    <script type="module" src="/js/dashboard.js"></script>
</body>
</html>

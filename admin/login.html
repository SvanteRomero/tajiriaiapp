<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <h1>Admin Login</h1>
        <form id="login-form">
            <div class="form-field"><label for="email">Email</label><input type="email" id="email" required></div>
            <div class="form-field"><label for="password">Password</label><input type="password" id="password" required></div>
            <button type="submit" class="submit-btn">Login</button>
        </form>
        <div id="error-message" class="status-message status-error"></div>
        <div class="auth-footer"><p>Need an account? <a href="/signup.html">Sign Up</a></p></div>
    </div>
    <script type="module" src="/js/login.js"></script>
</body>
</html>
